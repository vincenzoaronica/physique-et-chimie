<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Les cours, TPs et animations - Enseignement scientifique </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap"
    rel="stylesheet"
  >

  <style>

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #0f0f0f, #1c1c1c);
      color: white;
      font-family: 'Montserrat', sans-serif;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
      padding: 60px 20px;
    }

    h1 {
      text-align: center;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      font-weight: 300;
      opacity: 0.7;
    }

    .separator {
      width: 60%;
      height: 2px;
      background-color: white;
      margin: 30px auto 50px auto;
      opacity: 0.8;
    }


    /* THEMES */

    details {
      margin-bottom: 25px;
      border-bottom: 1px solid #444;
      padding-bottom: 15px;
    }

    summary {
      cursor: pointer;
      font-size: 1.1em;
      font-weight: 400;
      letter-spacing: 0.5px;
      padding: 12px 0;
    }

    summary:hover {
      opacity: 0.7;
    }

    .theme-content {
      padding: 10px 0 10px 25px;
    }


    /* GROUPES : COURS / CORRECTION / TP / ANIMATION */

    .document-group {
      margin-bottom: 22px;
    }

    .document-group:last-child {
      margin-bottom: 0;
    }

    .document-type {
      display: block;
      font-size: 0.72em;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.5;
      margin-bottom: 6px;
    }


    /* DOCUMENTS DANS CHAQUE GROUPE */

    .document {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 4px 0;
    }

    .document-title {
      font-size: 0.95em;
    }

    .open-button {
      color: white;
      text-decoration: none;
      font-size: 0.85em;
      opacity: 0.7;
      transition: opacity 0.2s ease;
      flex-shrink: 0;
    }

    .open-button:hover {
      opacity: 1;
    }


    /* IMAGE */

    .ES-image {
      width: 320px;
      max-width: 80%;
      margin: 0 auto 45px auto;
      background-color: #000;
      padding: 10px;
      border-radius: 8px;
    }

    .ES-image img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }


    /* NAVIGATION */

    .navigation {
      margin-top: 60px;
      text-align: center;
    }

    .navigation a {
      color: #aaa;
      text-decoration: none;
      font-size: 0.9em;
      margin: 0 12px;
    }

    .navigation a:hover {
      color: white;
    }


    /* VERSION MOBILE */

    @media (max-width: 600px) {

      .container {
        width: 90%;
        padding: 40px 10px;
      }

      .theme-content {
        padding-left: 15px;
      }

      .document {
        gap: 10px;
      }

      .document-title {
        font-size: 0.9em;
      }

      .open-button {
        font-size: 0.8em;
      }

    }

  </style>

</head>


<body>

<div class="container">


  <h1>Les cours, TPs et animations</h1>

  <p class="subtitle">
    Enseignement scientifique - Physique Chimie
  </p>

  <div class="separator"></div>


  <div class="ES-image">

    <img
      src="../images/image-terminale-2.png"
      alt="Illustration ES Physique Chimie"
    >

  </div>


  


  <!-- Le son -->

  <details>

    <summary>
      Le son
    </summary>

    <div class="theme-content">

      <!-- COURS -->

        
         <div class="document-group">

          <span class="document-type">
            Cours
          </span>
          
          <div class="document">

          <span class="document-title">
           Cours 1 : Le son
          </span>
       
           
        <a
          href="cours/1ES_Cours_01_Son_Vibration.pdf"
          target="_blank"
          class="open-button"
        >
          Ouvrir →
        </a>
      </div>

     </div>

      
     <div class="document">

        <div class="document-info">

          <span class="document-type">
            Correction
          </span>

          <span class="document-title">
            Applications et exercices
          </span>

        </div>

        <a
          href="cours/1ES_Cours_01_correction.pdf"
          target="_blank"
          class="open-button"
        >
          Ouvrir →
        </a>

      </div>

      </div>
  </details>




  




  <div class="navigation">

    <a href="../enseignement-scientifique.html">
      ← Enseignement scientifique
    </a>

    <a href="../index.html">
      Accueil
    </a>

  </div>


</div>

</body>

</html>
