<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Somme de deux signaux sinusoïdaux</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #d9f7ff; background: #02040d; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1160px; margin: auto; padding: 24px 20px; }
    h1 { margin: 0 0 18px; text-align: center; font-size: clamp(1.3rem, 3vw, 1.85rem); font-weight: 550; }
    .mesures { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px 24px; margin-bottom: 16px; font-variant-numeric: tabular-nums; }
    .mesures span { padding: 9px 14px; border: 1px solid #27445a; border-radius: 5px; background: #10283a; }
    canvas { display: block; width: 100%; height: clamp(320px, 38vw, 440px); }
    .reglages { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
    fieldset { min-width: 0; margin: 0; padding: 16px 20px; border: 1px solid #27445a; border-radius: 6px; }
    legend { padding: 0 8px; font-weight: 600; }
    .s1 { color: #5de5b0; } .s2 { color: #ffd166; } .somme { color: #eaffff; }
    .curseur + .curseur { margin-top: 16px; }
    .etiquette { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px 10px; }
    output { font-variant-numeric: tabular-nums; }
    input[type="range"] { display: block; width: 100%; height: 30px; margin: 4px 0 0; accent-color: #5de5b0; cursor: pointer; }
    #reglages-s2 input { accent-color: #ffd166; }
    .bas { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 22px; }
    .affichage { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 8px 18px 12px; }
    .affichage legend { color: #7fa6b8; font-size: .85rem; font-weight: 400; }
    .affichage label { display: flex; align-items: center; gap: 8px; min-height: 32px; cursor: pointer; }
    input[type="checkbox"] { width: 17px; height: 17px; margin: 0; accent-color: #5de5b0; }
    #voir-s2 { accent-color: #ffd166; } #voir-somme { accent-color: #eaffff; }
    :focus-visible { outline: 2px solid #48e9ff; outline-offset: 4px; }
    #erreur:empty { display: none; }
    @media (max-width: 650px) {
      main { padding: 18px 10px; }
      .reglages { grid-template-columns: 1fr; gap: 18px; }
      fieldset { padding: 12px 16px; }
      .bas, .affichage { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Somme de deux signaux sinusoïdaux</h1>
    <div class="mesures">
      <span id="dephasage">Décalage relatif : δ₂ − δ₁ = 0,00 λ</span>
    </div>
    <canvas id="signaux" width="1120" height="440" role="img" aria-label="Deux signaux sinusoïdaux de même période et leur somme. S₁ en vert menthe, S₂ en doré et la somme en blanc."></canvas>
    <div class="reglages">
      <fieldset>
        <legend class="s1">Signal S₁</legend>
        <div class="curseur">
          <label class="etiquette" for="amplitude1">Amplitude A₁ <output id="val-amplitude1" for="amplitude1">1,00</output></label>
          <input id="amplitude1" type="range" min="0" max="2" step="0.05" value="1">
        </div>
        <div class="curseur">
          <label class="etiquette" for="phase1">Décalage δ₁ <output id="val-phase1" for="phase1">0,00 λ</output></label>
          <input id="phase1" type="range" min="-0.5" max="0.5" step="0.01" value="0">
        </div>
      </fieldset>
      <fieldset id="reglages-s2">
        <legend class="s2">Signal S₂</legend>
        <div class="curseur">
          <label class="etiquette" for="amplitude2">Amplitude A₂ <output id="val-amplitude2" for="amplitude2">1,00</output></label>
          <input id="amplitude2" type="range" min="0" max="2" step="0.05" value="1">
        </div>
        <div class="curseur">
          <label class="etiquette" for="phase2">Décalage δ₂ <output id="val-phase2" for="phase2">0,00 λ</output></label>
          <input id="phase2" type="range" min="-0.5" max="0.5" step="0.01" value="0">
        </div>
      </fieldset>
    </div>
    <div class="bas">
      <fieldset class="affichage">
        <legend>Courbes affichées</legend>
        <label class="s1"><input id="voir-s1" type="checkbox" checked> S₁</label>
        <label class="s2"><input id="voir-s2" type="checkbox" checked> S₂</label>
        <label class="somme"><input id="voir-somme" type="checkbox" checked> S₁ + S₂</label>
      </fieldset>
    </div>
    <p id="erreur" role="status"></p>
    <noscript><p>Activez JavaScript pour utiliser cette animation.</p></noscript>
  </main>
  <script>
  (() => {
    "use strict";
    // Sᵢ(t) = Aᵢ sin(2π t/T + 2π δᵢ/λ). Les curseurs donnent δᵢ/λ.
    // δ est le décalage spatial équivalent à la phase : λ/2 correspond à π.
    // À décalage nul, les signaux partent de zéro vers leur maximum positif.
    const CONFIG = {
      COULEURS: ["#5de5b0", "#ffd166", "#eaffff"],
      FOND: "#02040d", PLOT: "#07101f", TEXTE: "#d9f7ff", SECONDAIRE: "#7fa6b8",
      LIMITE_Y: 4.4
    };
    const canvas = document.getElementById("signaux"), ctx = canvas.getContext("2d");
    const fond = document.createElement("canvas"), cf = fond.getContext("2d");
    if (!ctx || !cf) { document.getElementById("erreur").textContent="Le dessin Canvas n’est pas disponible dans ce navigateur."; return; }
    const sliders = ["amplitude1","phase1","amplitude2","phase2"].map(id=>document.getElementById(id));
    const affichage = ["voir-s1","voir-s2","voir-somme"].map(id=>document.getElementById(id));
    let amplitudes=[1,1], phases=[0,0], geometrie=null;
    const format=v=>v.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
    const decalage=v=>(v>0?"+":"")+format(v)+" λ";
    function valeurs(t) {
      const a=amplitudes[0]*Math.sin(2*Math.PI*t+phases[0]);
      const b=amplitudes[1]*Math.sin(2*Math.PI*t+phases[1]);
      // Les cases modifient uniquement l’affichage, jamais le calcul de la somme.
      return [a,b,a+b];
    }
    function preparerCourbes() {
      if(!geometrie) return;
      const g=geometrie;
      cf.setTransform(g.dpr,0,0,g.dpr,0,0); cf.fillStyle=CONFIG.FOND; cf.fillRect(0,0,g.w,g.h);
      cf.fillStyle=CONFIG.PLOT; cf.fillRect(g.left,g.top,g.pw,g.ph);
      cf.font="12px system-ui"; cf.textAlign="center";
      const pas = g.pw < 420 ? 0.5 : 0.25;
      for(let t=0;t<=2;t+=pas) {
        cf.strokeStyle="#18354a"; cf.lineWidth=.7; cf.beginPath(); cf.moveTo(g.x(t),g.top); cf.lineTo(g.x(t),g.top+g.ph); cf.stroke();
        cf.fillStyle=CONFIG.SECONDAIRE; cf.fillText(String(t).replace(".",","),g.x(t),g.top+g.ph+19);
      }
      cf.textAlign="right";
      for(let v=-4;v<=4;v++) {
        cf.strokeStyle=v===0?"#426077":"#18354a"; cf.lineWidth=v===0?1:.7;
        cf.beginPath(); cf.moveTo(g.left,g.y(v)); cf.lineTo(g.left+g.pw,g.y(v)); cf.stroke();
        cf.fillStyle=CONFIG.SECONDAIRE; cf.fillText(String(v),g.left-9,g.y(v)+4);
      }
      cf.strokeStyle="#27445a"; cf.lineWidth=1; cf.strokeRect(g.left,g.top,g.pw,g.ph);
      cf.fillStyle=CONFIG.TEXTE; cf.textAlign="center";
      cf.fillText("Temps réduit t / T",g.left+g.pw/2,g.top+g.ph+39);
      cf.save(); cf.translate(14,g.top+g.ph/2); cf.rotate(-Math.PI/2); cf.fillText("Amplitude",0,0); cf.restore();
      cf.save(); cf.beginPath(); cf.rect(g.left,g.top,g.pw,g.ph); cf.clip();
      for(let s=0;s<3;s++) {
        if(!affichage[s].checked) continue;
        cf.strokeStyle=CONFIG.COULEURS[s]; cf.lineWidth=s===2?3:2; cf.lineJoin="round";
        cf.beginPath();
        for(let i=0;i<=1000;i++) {
          const t=2*i/1000, v=valeurs(t)[s];
          if(i===0) cf.moveTo(g.x(t),g.y(v)); else cf.lineTo(g.x(t),g.y(v));
        }
        cf.stroke();
      }
      cf.restore();
    }
    function dessiner() {
      if(!geometrie) return;
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(fond,0,0);
    }
    function actualiser() {
      amplitudes=[Number(sliders[0].value),Number(sliders[2].value)];
      phases=[Number(sliders[1].value)*2*Math.PI,Number(sliders[3].value)*2*Math.PI];
      for(const input of sliders) {
        const v=Number(input.value), texte=input.id.startsWith("phase")?decalage(v):format(v);
        document.getElementById("val-"+input.id).textContent=texte; input.setAttribute("aria-valuetext",texte);
      }
      const delta=Math.round((Number(sliders[3].value)-Number(sliders[1].value))*100)/100;
      document.getElementById("dephasage").textContent="Décalage relatif : δ₂ − δ₁ = "+decalage(delta);
      const visibles=["S₁","S₂","S₁ + S₂"].filter((_,i)=>affichage[i].checked);
      canvas.setAttribute("aria-label",`Signaux sinusoïdaux de même période. Courbes affichées : ${visibles.join(", ")||"aucune"}. Décalage relatif équivalent : ${format(delta)} longueur d’onde.`);
      preparerCourbes(); dessiner();
    }
    sliders.forEach(input=>input.addEventListener("input",actualiser));
    affichage.forEach(input=>input.addEventListener("change",actualiser));
    function redimensionner() {
      const rect=canvas.getBoundingClientRect(), w=Math.max(1,rect.width), h=Math.max(1,rect.height);
      const dpr=Math.min(devicePixelRatio||1,2), left=w<480?42:54, top=16;
      const pw=Math.max(1,w-left-18), ph=Math.max(1,h-top-50);
      canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); fond.width=canvas.width; fond.height=canvas.height;
      geometrie={w,h,dpr,left,top,pw,ph,x:t=>left+t/2*pw,y:v=>top+(CONFIG.LIMITE_Y-v)/(2*CONFIG.LIMITE_Y)*ph};
      preparerCourbes(); dessiner();
    }
    window.addEventListener("resize",redimensionner);
    if(typeof ResizeObserver!=="undefined") new ResizeObserver(redimensionner).observe(canvas);
    actualiser(); redimensionner();
  })();
  </script>
</body>
</html>
