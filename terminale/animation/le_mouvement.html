<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trajectoire curviligne — Position et vitesse</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #02040d; color: #d9f7ff; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1120px; margin: auto; padding: 24px 20px; }
    h1 { margin: 0 0 16px; text-align: center; font-size: clamp(1.3rem, 3vw, 1.8rem); font-weight: 550; }
    .temps { margin: 0 auto 12px; text-align: center; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    canvas { display: block; width: 100%; height: clamp(340px, 52vw, 570px); }
    .vecteurs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .carte { padding: 16px 20px; border: 1px solid #27445a; border-radius: 6px; background: #07101f; }
    .choix { display: flex; align-items: center; gap: 10px; min-height: 30px; cursor: pointer; font-weight: 600; }
    .position { color: #5de5b0; } .vitesse { color: #ffd166; }
    input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: #5de5b0; }
    #voir-vitesse { accent-color: #ffd166; }
    .coordonnees { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 14px; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
    .coordonnees[hidden] { display: none; }
    .echelle { margin: 10px 0 0; color: #7fa6b8; font-size: .8rem; }
    .controles { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 24px 36px; margin-top: 24px; }
    .etiquette { display: flex; justify-content: space-between; gap: 12px; }
    output { font-variant-numeric: tabular-nums; }
    input[type="range"] { display: block; width: 100%; height: 32px; margin: 6px 0 0; accent-color: #48e9ff; cursor: pointer; }
    .actions { display: flex; gap: 12px; }
    button { min-width: 140px; min-height: 46px; padding: 10px 18px; border: 1px solid #27445a; border-radius: 5px; color: #d9f7ff; background: #10283a; font: inherit; cursor: pointer; }
    button:hover { background: #1b4056; }
    :focus-visible { outline: 2px solid #48e9ff; outline-offset: 4px; }
    #erreur:empty { display: none; }
    @media(max-width:650px) {
      main { padding: 18px 10px; }
      .vecteurs { grid-template-columns: 1fr; gap: 14px; }
      .carte { padding: 12px 16px; }
      .controles { grid-template-columns: 1fr; gap: 16px; }
      .actions button { flex: 1; min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Trajectoire curviligne — Position et vitesse</h1>
    <p class="temps">t = <output id="temps">0,00</output> s</p>
    <canvas id="trajectoire" width="1080" height="570" role="img" aria-label="Un point M parcourt la courbe y = 1,75 + 0,55 sin(1,35 x − 0,7) + 0,08 x, de x = 0,15 m à x = 4 m, dans un repère orthonormé x–y. Le vecteur position OM est vert menthe et le vecteur vitesse tangent à la trajectoire est doré. Leurs projections et composantes peuvent être affichées séparément."></canvas>
    <div class="vecteurs">
      <div class="carte">
        <label class="choix position"><input id="voir-position" type="checkbox" checked> Vecteur OM et coordonnées</label>
        <div class="coordonnees position" id="coord-position">
          <span>x = <output id="x">0,00</output> m</span>
          <span>y = <output id="y">0,00</output> m</span>
        </div>
      </div>
      <div class="carte">
        <label class="choix vitesse"><input id="voir-vitesse" type="checkbox" checked> Vecteur v(t) et coordonnées</label>
        <div class="coordonnees vitesse" id="coord-vitesse">
          <span>vₓ = <output id="vx">0,00</output> m/s</span>
          <span>vᵧ = <output id="vy">0,00</output> m/s</span>
        </div>
        <p class="echelle" id="echelle">Échelle de v : 1 m/s correspond à 2 m sur le repère.</p>
      </div>
    </div>
    <div class="controles">
      <div>
        <label class="etiquette" for="instant">Instant t <output id="val-instant" for="instant">0,00 s</output></label>
        <input id="instant" type="range" min="0" max="10" step="0.01" value="0">
      </div>
      <div class="actions">
        <button id="pause" type="button" title="Pause ou reprise : barre espace">Pause</button>
        <button id="reset" type="button">Réinitialiser</button>
      </div>
    </div>
    <p id="erreur" role="status"></p>
    <noscript><p>Activez JavaScript pour utiliser cette animation.</p></noscript>
  </main>
  <script>
  (() => {
    "use strict";
    // Trajectoire demandée : y(x) = 1,75 + 0,55 sin(1,35 x - 0,7) + 0,08 x.
    // x(t) avance uniformément de 0,15 à 4 m en 10 secondes.
    // vₓ = dx/dt ; vᵧ = (dy/dx) vₓ. La vitesse reste tangente à la courbe.
    const CONFIG = {
      OFFSET_Y: 1.75, HAUTEUR: .55, NOMBRE_ONDE: 1.35, PHASE: -.7, PENTE: .08,
      X_DEBUT: .15, X_FIN: 4, DUREE: 10,
      ECHELLE_V: 2, // Secondes : conversion de la vitesse en longueur dessinée.
      X_MIN: -.65, X_MAX: 5.2, Y_MIN: -.5, Y_MAX: 3.2,
      FOND: "#02040d", PLOT: "#07101f", AXES: "#7895ab",
      POSITION: "#5de5b0", VITESSE: "#ffd166", TRAJECTOIRE: "#6087ad", POINT: "#eaffff"
    };
    const canvas=document.getElementById("trajectoire"), ctx=canvas.getContext("2d");
    if(!ctx) { document.getElementById("erreur").textContent="Le dessin Canvas n’est pas disponible dans ce navigateur."; return; }
    const voirPosition=document.getElementById("voir-position"), voirVitesse=document.getElementById("voir-vitesse");
    const instant=document.getElementById("instant"), pause=document.getElementById("pause");
    const sorties=Object.fromEntries(["temps","val-instant","x","y","vx","vy"].map(id=>[id,document.getElementById(id)]));
    const vitesseX=(CONFIG.X_FIN-CONFIG.X_DEBUT)/CONFIG.DUREE;
    instant.max=CONFIG.DUREE;
    let temps=0, geometrie=null, animation=null, dernierInstant=null, scrutation=false;
    let enPause=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const format=v=>(Math.abs(v)<.005?0:v).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
    function trajectoire(x) {
      return CONFIG.OFFSET_Y+CONFIG.HAUTEUR*Math.sin(CONFIG.NOMBRE_ONDE*x+CONFIG.PHASE)+CONFIG.PENTE*x;
    }
    function etat() {
      const x=CONFIG.X_DEBUT+vitesseX*temps;
      return {x,y:trajectoire(x),vx:vitesseX,
        vy:(CONFIG.HAUTEUR*CONFIG.NOMBRE_ONDE*Math.cos(CONFIG.NOMBRE_ONDE*x+CONFIG.PHASE)+CONFIG.PENTE)*vitesseX};
    }
    function fleche(x0,y0,x1,y1,couleur,largeur=2.5,tete=10) {
      const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy);
      if(l<2) return;
      const ux=dx/l,uy=dy/l,h=Math.min(tete,l*.45);
      ctx.strokeStyle=couleur; ctx.fillStyle=couleur; ctx.lineWidth=largeur;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1-ux*h*.7,y1-uy*h*.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1-ux*h-uy*h*.4,y1-uy*h+ux*h*.4);
      ctx.lineTo(x1-ux*h+uy*h*.4,y1-uy*h-ux*h*.4); ctx.closePath(); ctx.fill();
    }
    function texte(contenu,x,y,couleur,taille=15,alignement="center") {
      ctx.fillStyle=couleur; ctx.font=`${taille>=18?"600 ":""}${taille}px system-ui`; ctx.textAlign=alignement; ctx.fillText(contenu,x,y);
    }
    function dessiner() {
      if(!geometrie) return;
      const g=geometrie,{x,y,vx,vy}=etat();
      const px=g.x(x),py=g.y(y),ox=g.x(0),oy=g.y(0);
      ctx.setTransform(g.dpr,0,0,g.dpr,0,0); ctx.fillStyle=CONFIG.FOND; ctx.fillRect(0,0,g.w,g.h);
      ctx.fillStyle=CONFIG.PLOT; ctx.fillRect(g.left,g.top,g.pw,g.ph);
      ctx.lineWidth=.7; ctx.strokeStyle="#14283d"; ctx.beginPath();
      for(let i=Math.ceil(CONFIG.X_MIN*2)/2;i<=CONFIG.X_MAX;i+=.5) { ctx.moveTo(g.x(i),g.top); ctx.lineTo(g.x(i),g.top+g.ph); }
      for(let j=Math.ceil(CONFIG.Y_MIN*2)/2;j<=CONFIG.Y_MAX;j+=.5) { ctx.moveTo(g.left,g.y(j)); ctx.lineTo(g.left+g.pw,g.y(j)); }
      ctx.stroke();
      fleche(g.left,oy,g.left+g.pw,oy,CONFIG.AXES,1.2,8);
      fleche(ox,g.top+g.ph,ox,g.top,CONFIG.AXES,1.2,8);
      const pas=g.pw<440?2:1;
      for(let i=Math.ceil(CONFIG.X_MIN/pas)*pas;i<=CONFIG.X_MAX;i+=pas) if(i!==0) texte(String(i),g.x(i),oy+17,"#7fa6b8",11);
      for(let j=Math.ceil(CONFIG.Y_MIN*2)/2;j<=CONFIG.Y_MAX;j+=.5) if(j!==0) texte(String(j).replace(".",","),ox-9,g.y(j)+4,"#7fa6b8",11,"right");
      texte("x (m)",g.left+g.pw-4,oy-12,"#d9f7ff",13,"right");
      texte("y (m)",ox+12,g.top+14,"#d9f7ff",13,"left");
      texte("O",ox-10,oy+18,"#d9f7ff",14,"right");
      ctx.strokeStyle=CONFIG.TRAJECTOIRE; ctx.lineWidth=1.8; ctx.beginPath();
      for(let i=0;i<500;i++) {
        const abscisse=CONFIG.X_DEBUT+(CONFIG.X_FIN-CONFIG.X_DEBUT)*i/499;
        if(i===0) ctx.moveTo(g.x(abscisse),g.y(trajectoire(abscisse)));
        else ctx.lineTo(g.x(abscisse),g.y(trajectoire(abscisse)));
      }
      ctx.stroke();
      if(voirPosition.checked) {
        ctx.strokeStyle=CONFIG.POSITION; ctx.lineWidth=1.3; ctx.setLineDash([5,5]); ctx.beginPath();
        ctx.moveTo(px,oy); ctx.lineTo(px,py); ctx.lineTo(ox,py); ctx.stroke(); ctx.setLineDash([]);
        fleche(ox,oy,px,py,CONFIG.POSITION,2.8,11);
        ctx.fillStyle=CONFIG.POSITION;
        for(const [a,b] of [[px,oy],[ox,py]]) { ctx.beginPath(); ctx.arc(a,b,3.4,0,2*Math.PI); ctx.fill(); }
        if(Math.abs(x)>.25) texte("x",px,oy+(y>=0?31:-14),CONFIG.POSITION,17);
        if(Math.abs(y)>.25) texte("y",ox+(x>=0?-18:18),py-7,CONFIG.POSITION,17);
      }
      if(voirVitesse.checked) {
        const tx=g.x(x+CONFIG.ECHELLE_V*vx),ty=g.y(y+CONFIG.ECHELLE_V*vy);
        // Décomposition du vecteur vitesse dans la même base x–y, à partir de M.
        ctx.save(); ctx.globalAlpha=.6; ctx.strokeStyle=CONFIG.VITESSE; ctx.lineWidth=1.1; ctx.setLineDash([4,5]);
        ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px,ty); ctx.lineTo(tx,ty); ctx.stroke(); ctx.setLineDash([]);
        fleche(px,py,tx,py,CONFIG.VITESSE,1.3,7);
        fleche(tx,py,tx,ty,CONFIG.VITESSE,1.3,7); ctx.restore();
        fleche(px,py,tx,ty,CONFIG.VITESSE,3,12);
        texte("v(t)",tx+(vx>=0?11:-11),ty-10,CONFIG.VITESSE,18,vx>=0?"left":"right");
        if(Math.abs(vx)>.15) texte("vₓ",(px+tx)/2,py+(vy>=0?21:-11),CONFIG.VITESSE,15);
        if(Math.abs(vy)>.15) texte("vᵧ",tx+(vx>=0?11:-11),(py+ty)/2+5,CONFIG.VITESSE,15,vx>=0?"left":"right");
      }
      ctx.fillStyle=CONFIG.POINT; ctx.strokeStyle=CONFIG.FOND; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(px,py,6.5,0,2*Math.PI); ctx.fill(); ctx.stroke();
      // Placer le nom M en retrait du vecteur vitesse, dirigé vers la droite.
      texte("M",px-13,py-15,CONFIG.POINT,22,"right");
      sorties.temps.textContent=format(temps); sorties["val-instant"].textContent=format(temps)+" s";
      sorties.x.textContent=format(x); sorties.y.textContent=format(y); sorties.vx.textContent=format(vx); sorties.vy.textContent=format(vy);
      if(!scrutation) instant.value=temps;
      instant.setAttribute("aria-valuetext",format(temps)+" secondes");
    }
    function actualiserAffichage() {
      document.getElementById("coord-position").hidden=!voirPosition.checked;
      document.getElementById("coord-vitesse").hidden=!voirVitesse.checked;
      document.getElementById("echelle").hidden=!voirVitesse.checked;
      dessiner();
    }
    function arreter() { if(animation!==null) cancelAnimationFrame(animation); animation=null; dernierInstant=null; }
    function programmer() { if(!enPause&&!scrutation&&!document.hidden&&animation===null) animation=requestAnimationFrame(animer); }
    function animer(instantAnimation) {
      animation=null;
      if(enPause||scrutation||document.hidden) return;
      if(dernierInstant!==null) temps=(temps+Math.min(Math.max(0,(instantAnimation-dernierInstant)/1000),.05))%CONFIG.DUREE;
      dernierInstant=instantAnimation; dessiner(); programmer();
    }
    function basculerPause() { enPause=!enPause; pause.textContent=enPause?"Reprendre":"Pause"; arreter(); programmer(); }
    function reinitialiser() { arreter(); temps=0; instant.value=0; dessiner(); programmer(); }
    voirPosition.addEventListener("change",actualiserAffichage);
    voirVitesse.addEventListener("change",actualiserAffichage);
    pause.addEventListener("click",basculerPause);
    document.getElementById("reset").addEventListener("click",reinitialiser);
    // Suspendre la lecture pendant le déplacement du curseur, puis la reprendre.
    function commencerReglage() { scrutation=true; arreter(); }
    function terminerReglage() { if(!scrutation) return; scrutation=false; dernierInstant=null; programmer(); }
    instant.addEventListener("pointerdown",commencerReglage);
    window.addEventListener("pointerup",terminerReglage);
    window.addEventListener("pointercancel",terminerReglage);
    const touchesCurseur=["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End","PageUp","PageDown"];
    instant.addEventListener("keydown",e=>{if(touchesCurseur.includes(e.key)) commencerReglage();});
    instant.addEventListener("keyup",e=>{if(touchesCurseur.includes(e.key)) terminerReglage();});
    instant.addEventListener("blur",terminerReglage);
    instant.addEventListener("input",()=>{temps=Number(instant.value);dernierInstant=null;dessiner();});
    document.addEventListener("keydown",e=>{
      if(e.repeat||e.ctrlKey||e.altKey||e.metaKey||(e.target instanceof Element&&e.target.closest("input,button,textarea,select,a,[contenteditable]"))) return;
      if(e.code==="Space") {e.preventDefault();basculerPause();}
      else if(e.key.toLowerCase()==="r") {e.preventDefault();reinitialiser();}
    });
    function redimensionner() {
      const rect=canvas.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height),dpr=Math.min(devicePixelRatio||1,2);
      canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
      const unite=Math.max(.1,Math.min((w-28)/(CONFIG.X_MAX-CONFIG.X_MIN),(h-30)/(CONFIG.Y_MAX-CONFIG.Y_MIN)));
      const pw=unite*(CONFIG.X_MAX-CONFIG.X_MIN),ph=unite*(CONFIG.Y_MAX-CONFIG.Y_MIN),left=(w-pw)/2,top=(h-ph)/2;
      geometrie={w,h,dpr,left,top,pw,ph,unite,x:v=>left+(v-CONFIG.X_MIN)*unite,y:v=>top+(CONFIG.Y_MAX-v)*unite};
      dessiner();
    }
    window.addEventListener("resize",redimensionner);
    if(typeof ResizeObserver!=="undefined") new ResizeObserver(redimensionner).observe(canvas);
    document.addEventListener("visibilitychange",()=>{arreter();programmer();});
    window.addEventListener("pagehide",arreter);
    window.addEventListener("pageshow",()=>{dernierInstant=null;programmer();});
    pause.textContent=enPause?"Reprendre":"Pause";
    redimensionner();actualiserAffichage();programmer();
  })();
  </script>
</body>
</html>
